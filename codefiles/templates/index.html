<!doctype html>
<html><head><meta charset="utf-8"><title>ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><main class="card">
<h1>🎨 ComicCraft</h1><p>AI Fantasy Comic Story Creator</p>
<form method="post" action="/generate">
<label>Story idea</label><textarea name="story_prompt" required>A college student discovers a magical book in an ancient library and must solve a mystery with a friendly robot.</textarea>
<label>Character</label><input name="character_name" value="Arjun" required>
<label>Setting</label><input name="setting" value="Ancient Magical Kingdom" required>
<label>Tone</label><input name="tone" value="Adventurous and inspiring" required>
<label>Art style</label><input name="art_style" value="Fantasy Comic Book" required>
<button type="submit">Generate AI Comic</button>
</form>
</main></body></html>
